# Build a release .vsix and attach it to the GitHub Release.
#
# Triggers when a GitHub Release is published (the tag becomes the release
# version). Builds the .vsix and attaches it to the Release so it can be
# downloaded and published manually (see publish.yml for the manual publish
# workflow).
#
# Before releasing: bump "version" in package.json to the new version and
# create a Release with tag v<version>. The workflow verifies they match.

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax and webview checks
        run: |
          npm run check
          npm run check:webview

      - name: Check release tag matches package.json version
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Release tag v$tag does not match package.json version $version. Bump package.json first."
            exit 1
          fi

      - name: Package vsix
        run: npx @vscode/vsce package --out "jcode-vscode-${{ github.ref_name }}.vsix"

      - name: Attach vsix to GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: "jcode-vscode-${{ github.ref_name }}.vsix"
